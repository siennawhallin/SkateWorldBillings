		<section class="booking-form-section">
			<div class="container">
				<h3>Book Your Skate Lesson</h3>
				<form id="booking-form">
					<div class="form-group">
						<label for="fullName">Full Name</label>
						<input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
					</div>
					<div class="form-group">
						<label for="email">Email Address</label>
						<input type="email" class="form-control" id="email" placeholder="Enter your email" required>
					</div>
					<div class="form-group">
						<label for="phone">Phone Number</label>
						<input type="text" class="form-control" id="phone" placeholder="Enter your phone number" required>
					</div>
					<div class="form-group">
						<label for="lessonType">Select Lesson Type</label>
						<select class="form-control" id="lessonType" required>
							<option value="beginner">Beginner Skate Lessons</option>
							<option value="intermediate">Intermediate Skate Lessons</option>
							<option value="advanced">Advanced Skate Lessons</option>
						</select>
					</div>
					<div class="form-group">
						<label for="lessonDate">Preferred Lesson Date</label>
						<input type="date" class="form-control" id="lessonDate" required>
					</div>
					<div class="form-group">
						<label for="lessonTime">Preferred Time</label>
						<input type="time" class="form-control" id="lessonTime" required>
					</div>
					<button type="submit" id="submit-btn" class="booking-btn btn btn-primary btn-block">Submit Booking</button>
				</form>
			</div>
		</section>
		<script>
			document.getElementById('booking-form').addEventListener('submit', function(event) {
			  event.preventDefault();
			  alert("Booking submitted successfully! Please pay down below.");
			});
		</script>
		<section class="payment-section">
			<div class="container">
				<h3>Payment Information</h3>
				<form id="payment-form">
					<div class="form-group">
						<label for="creditCardNumber">Credit Card Number</label>
						<input type="text" class="form-control" id="creditCardNumber" placeholder="Enter your credit card number" required>
					</div>
					<div class="form-group">
						<label for="expirationDate">Expiration Date</label>
						<input type="month" class="form-control" id="expirationDate" required>
					</div>
					<div class="form-group">
						<label for="cvv">CVV</label>
						<input type="text" class="form-control" id="cvv" placeholder="Enter your CVV" required>
					</div>
					<button type="submit" class="payment-btn btn btn-primary btn-block">Submit Payment </button>
				</form>
			</div>
		</section>
		<script>
			document.getElementById('payment-form').addEventListener('submit', function(event) {
			  event.preventDefault();
			  alert("Payment submitted successfully!");
			});
